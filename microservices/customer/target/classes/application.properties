spring.application.name=customer
server.port=8081

# ---- H2 database (in memory) ----
spring.datasource.url=jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:mem:customerdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- URL of the Orders microservice (used by RestClient) ----
orders.service.url=http://localhost:8082
